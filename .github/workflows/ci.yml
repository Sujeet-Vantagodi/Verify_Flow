name: VerifyFlow CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verifyflow
          POSTGRES_PASSWORD: verifyflow
          POSTGRES_DB: verifyflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verifyflow -d verifyflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://verifyflow:verifyflow@localhost:5432/verifyflow
      OTP_HASH_SECRET: ci-otp-hash-secret-must-be-at-least-32-chars
      PAIRING_HASH_SECRET: ci-pairing-hash-secret-must-be-32-chars
      FRONTEND_URL: http://localhost:5173
      BACKEND_PUBLIC_URL: http://localhost:5000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate --workspace backend

      - name: Apply database migrations
        run: npm run db:deploy --workspace backend

      - name: Run backend tests
        run: npm test --workspace backend

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Build backend
        run: npm run build --workspace backend
